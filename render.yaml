services:
  - type: web
    name: traveller-prediction
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: JWT_SECRET
        generateValue: true
